[package]
name = "thud"
version = "0.1.0"
edition = "2024"
description = "Terminal Heads Up Display - terminal-emulator-agnostic and shell-agnostic HUD compositor"

[dependencies]
chrono = "0.4"
libc = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
unicode-width = "0.2"
vt100 = "0.18"
